apiVersion: apps/v1
kind: Deployment

metadata:
  name: backend

spec:
  replicas: 1

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      containers:
      - name: backend

        image: moinnaik/portfolio-backend:v1

        ports:
        - containerPort: 4518

        envFrom:
        - secretRef:
            name: backend-secret
